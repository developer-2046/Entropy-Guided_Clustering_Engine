apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: market-entropy-ingress
  namespace: market-entropy
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/websocket-services: "market-entropy-api"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
  - hosts:
    - api.marketentropy.dev
    secretName: marketentropy-tls
  rules:
  - host: api.marketentropy.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: market-entropy-api
            port:
              number: 8000