apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-entropy-api
  namespace: market-entropy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: market-entropy-api
  template:
    metadata:
      labels:
        app: market-entropy-api
    spec:
      containers:
      - name: api
        image: your-registry/market-entropy-api:latest
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: url
        - name: ALPHA_VANTAGE_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: alpha-vantage
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5